<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>万楼进销存 · 完整交互原型</title>
<style>
:root{
  --ink:#0A0D12; --ink-2:#0F131C; --ink-3:#161D2B;
  --paper:#F8F9F7; --line:#E1E4E0; --line-2:#EDEFEC;
  --text:#1A1F28; --muted:#6B7580; --faint:#98A1AB;
  --brand:#1F6E5A; --brand-hover:#1A5E4D; --brand-soft:#E6F0EC;
  --amber:#B97629; --amber-soft:#FBF0E2;
  --rust:#A8442A; --rust-soft:#FAE9E4;
  --blue:#2C5C8A; --blue-soft:#E7EEF5;
  --r:6px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--text);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--brand);text-decoration:none}

/* Layout */
.app{display:flex;min-height:100vh}
.side{width:180px;background:var(--ink);flex:0 0 180px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.logo{padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo b{display:block;color:#fff;font-size:15px;font-weight:600;letter-spacing:.4px}
.logo span{display:block;color:#7A8895;font-size:10.5px;margin-top:3px;letter-spacing:.3px}
.nav{overflow-y:auto;padding:8px 0 24px;flex:1}
.nav-group{padding:14px 18px 5px;color:#5B6A78;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase}
.nav a{display:block;padding:8px 18px;color:#B5C1CC;font-size:12.5px;border-left:2px solid transparent;transition:all .1s}
.nav a:hover{background:var(--ink-2);color:#fff}
.nav a.on{background:var(--ink-2);color:#fff;border-left-color:#4FA88E}

.main{flex:1;min-width:0}
.top{height:50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 22px;position:sticky;top:0;z-index:30}
.crumb{font-size:12px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:600}
.spacer{flex:1}
.who{font-size:12px;color:var(--muted)}
.who b{color:var(--text);font-weight:600}
.content{padding:20px 24px 60px;max-width:1600px}

/* Primitives */
h1{font-size:18px;font-weight:600;margin-bottom:4px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:7px 15px;border-radius:var(--r);border:1px solid var(--line);background:#fff;font-size:12.5px;transition:all .12s;cursor:pointer}
.btn:hover{background:#FAFBFA}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover)}
.btn.ghost{border:none;background:transparent;color:var(--muted);padding:6px 10px}
.btn.ghost:hover{background:var(--line-2);color:var(--text)}
.btn.sm{padding:4px 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.inp{border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;background:#fff}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}

/* Table */
table{width:100%;border-collapse:collapse;background:#fff}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#FBFCFB}
td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:#FCFDFC}
td.r,th.r{text-align:right}
td.link{color:var(--brand);cursor:pointer}
td.link:hover{text-decoration:underline}
.t-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--line)}

.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11.5px;line-height:1.4;white-space:nowrap}
.tag.wait{background:var(--amber-soft);color:var(--amber)}
.tag.ok{background:var(--brand-soft);color:var(--brand)}
.tag.no{background:var(--rust-soft);color:var(--rust)}

/* Form */
.form{max-width:900px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:var(--muted);font-weight:500}
.field .inp,.field select{width:100%}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:8px;max-width:90%;max-height:90%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:16px;font-weight:600}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat-label{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.stat-val{font-size:24px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>

// ========== 核心逻辑 ==========
let currentPage = '出库单列表';

function showPage(pageName, param) {
  currentPage = pageName;
  document.getElementById('crumb-page').textContent = pageName;

  // 更新导航高亮
  document.querySelectorAll('.nav a').forEach(a => {
    a.classList.toggle('on', a.dataset.page === pageName);
  });

  // 渲染页面
  const content = pages[pageName];
  if (content) {
    document.getElementById('content').innerHTML = typeof content === 'function' ? content(param) : content;
  } else {
    document.getElementById('content').innerHTML = `
      <div class="card pad" style="text-align:center;padding:60px 20px">
        <div style="font-size:48px;opacity:.2">🚧</div>
        <h2 style="margin-top:16px">${pageName}</h2>
        <p style="color:var(--muted);margin-top:8px">功能开发中...</p>
        <button class="btn" style="margin-top:20px" onclick="showPage('出库单列表')">返回首页</button>
      </div>
    `;
  }
}

function openModal(title, bodyHTML) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function handleModalSave() {
  alert('保存成功');
  closeModal();
}

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  // 绑定导航点击
  document.querySelectorAll('.nav a').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      showPage(a.dataset.page);
    });
  });

  // 显示首页
  showPage('出库单列表');
});
</script>
